<div class="error-state" role="alert">
  <span class="error-state__icon" aria-hidden="true">
    <lucide-icon [img]="alertIcon" [size]="20" />
  </span>
  <div class="error-state__body">
    <h3 class="error-state__title">{{ title() }}</h3>
    @if (displayMessage(); as msg) {
      <p class="error-state__message">{{ msg }}</p>
    }
  </div>
  @if (canRetry() || sessionExpired()) {
    <div class="error-state__actions">
      @if (canRetry()) {
        <button
          type="button"
          class="error-state__retry"
          [disabled]="retrying()"
          (click)="onRetry()"
        >
          <lucide-icon
            class="error-state__retry-icon"
            [class.error-state__retry-icon--spinning]="retrying()"
            [img]="refreshIcon"
            [size]="14"
          />
          {{ retryLabel() }}
        </button>
      }
      @if (sessionExpired()) {
        <button
          type="button"
          class="error-state__login"
          (click)="onLogin()"
        >
          <lucide-icon [img]="loginIcon" [size]="14" />
          Entrar novamente
        </button>
      }
    </div>
  }
</div>
