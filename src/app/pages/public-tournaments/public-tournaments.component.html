<section class="page">
  <header class="page__header">
    <h1 class="page__title">Torneios públicos</h1>
    <p class="page__subtitle">
      Torneios abertos para qualquer um entrar com o código
    </p>
  </header>

  @if (loading()) {
    <div class="page__grid">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="u-skeleton page__skeleton-card"></div>
      }
    </div>
  } @else if (loadError(); as err) {
    <app-error-state
      title="Não foi possível carregar os torneios"
      [error]="err"
      [canRetry]="true"
      [retrying]="loading()"
      (retry)="retry()"
    />
  } @else if (isEmpty()) {
    <app-empty-state
      [icon]="globeIcon"
      title="Nenhum torneio público no momento"
      description="Volte mais tarde ou crie o seu próprio torneio."
    />
  } @else {
    <div class="page__grid" [@listStagger]="items().length">
      @for (t of items(); track t.id) {
        <a
          class="page__card-link"
          [routerLink]="['/tournaments', t.id]"
          [attr.aria-label]="'Ver torneio ' + t.name"
        >
          <app-tournament-card [tournament]="t" [showOwner]="true" />
        </a>
      }
    </div>

    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalElements]="totalElements()"
      [disabled]="loading()"
      (pageChange)="goToPage($event)"
    />
  }
</section>
